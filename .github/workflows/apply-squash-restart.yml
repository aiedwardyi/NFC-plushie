name: apply-squash-restart
on:
  workflow_dispatch:
  push:
    branches:
      - fix/multi-tap-squash-restart
    paths:
      - .github/workflows/apply-squash-restart.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply restart pattern with Python
        run: python3 .github/scripts/patch_squash_restart.py
      - name: Commit and push
        run: |
          git config user.name "Edward Yi"
          git config user.email "41576951+aiedwardyi@users.noreply.github.com"
          git add public/app.js
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix: restart squash animation on every multi-tap"
          git push
