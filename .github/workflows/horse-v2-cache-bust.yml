name: Apply horse v2 cache-bust
on:
  workflow_dispatch:
  push:
    branches: [fix/horse-png-cache-bust-v2]
    paths:
      - .github/workflows/horse-v2-cache-bust.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horse-png-cache-bust-v2
      - name: Copy v2 PNGs and update refs
        run: |
          set -euo pipefail
          cp public/mascot-horse-512.png public/mascot-horse-512-v2.png
          cp public/mascot-horse-away-512.png public/mascot-horse-away-512-v2.png
          cp public/mascot-horse-blink-512.png public/mascot-horse-blink-512-v2.png
          cp public/mascot-horse-react-512.png public/mascot-horse-react-512-v2.png
          cp public/mascot-horse-sleepy-512.png public/mascot-horse-sleepy-512-v2.png
          sed -i \
            -e 's|/mascot-horse-away-512.png|/mascot-horse-away-512-v2.png|g' \
            -e 's|/mascot-horse-512.png|/mascot-horse-512-v2.png|g' \
            src/pages.js
          sed -i 's|/mascot-horse-512.png|/mascot-horse-512-v2.png|g' public/app.js
          sed -i 's|/mascot-horse-512.png|/mascot-horse-512-v2.png|g' tests/app.test.js
          md5sum public/mascot-horse-512-v2.png
          grep -n 'mascot-horse' src/pages.js public/app.js tests/app.test.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mascot-horse-*-v2.png src/pages.js public/app.js tests/app.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: cache-bust horse PNGs with -v2 URLs (phones kept white-BG)"
            git push
          fi
