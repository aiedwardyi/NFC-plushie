services:
  - type: web
    name: nfc-plushie
    runtime: node
    plan: starter
    buildCommand: npm ci && cp public/mascot-horse-512.png public/mascot-horse-512-v2.png && cp public/mascot-horse-away-512.png public/mascot-horse-away-512-v2.png && cp public/mascot-horse-blink-512.png public/mascot-horse-blink-512-v2.png && cp public/mascot-horse-react-512.png public/mascot-horse-react-512-v2.png && cp public/mascot-horse-sleepy-512.png public/mascot-horse-sleepy-512-v2.png
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: plushie-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
