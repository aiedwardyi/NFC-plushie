<!doctype html>
<html lang="ko" data-mascot="horse">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141B2B">
  <meta name="color-scheme" content="light dark">
  <title>새 친구 | 인형 친구</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kinds.css">
  <link rel="stylesheet" href="/mascot-toggle.css">
  <script src="/mascot-boot.js" data-mascots="horse sheep" data-reveals="rat ox tiger rabbit dragon snake horse sheep monkey rooster dog pig"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="topbar">
      <span class="wordmark">POKKEY</span>
      <aside class="mascot-toggle" data-mascot-toggle role="group" aria-label="친구 바꾸기">
    <button type="button" class="mascot-tog is-active" data-mascot="horse" aria-label="말 친구" aria-pressed="true">
      <img src="/mascot-horse-512-v3.png" width="32" height="32" alt="" decoding="async" draggable="false">
    </button>
    <button type="button" class="mascot-tog" data-mascot="sheep" aria-label="양 친구" aria-pressed="false">
      <img src="/mascot-sheep-512-v3.png" width="32" height="32" alt="" decoding="async" draggable="false">
    </button>
  </aside>
      
    </header>
    <section class="plate">
      
      <h1 class="nameplate" data-nameplate>새 친구</h1>
      
    </section>
    <div class="window" data-window>
      <div class="sky" aria-hidden="true">
        <span class="stars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="motes"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="floor"></span>
      </div>
      <div class="pet" data-pet="alive">
      <button type="button" class="pet-hit" aria-label="다정한 친구가 방긋 웃어요">
        <span class="pet-motion">
          <img class="pet-frame is-show" data-frame="canon" src="/mascot-horse-512-v3.png" width="220" height="220" alt="다정한 친구가 방긋 웃어요" decoding="async" draggable="false">
          <img class="pet-frame" data-frame="blink" src="/mascot-horse-512-v3.png" width="220" height="220" alt="" aria-hidden="true" decoding="async" draggable="false">
          <img class="pet-frame" data-frame="react" src="/mascot-horse-512-v3.png" width="220" height="220" alt="" aria-hidden="true" decoding="async" draggable="false">
          <img class="pet-frame" data-frame="sleepy" src="/mascot-horse-512-v3.png" width="220" height="220" alt="" aria-hidden="true" decoding="async" draggable="false">
        </span>
      </button>
    </div>
    </div>
    
    
    <p>이 친구는 인형 속에서 기다리고 있어요. 인형에 폰을 톡 대 주세요.</p>
    
    <footer>토닥이면 깨어나는 작은 친구</footer>
  </main>
  
  
</body>
</html>
